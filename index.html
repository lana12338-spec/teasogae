<!DOCTYPE html>
<html lang="ko">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tea Lover's Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-layout">
        <div class="left">
            <div class="form-scroll">
            <h2>정보 입력</h2>
            <label for="input-photo">프로필 이미지</label>

            <input type="file" id="input-photo" class="file-input" accept="image/*">

            <div class="photo-actions">
            <label for="input-photo" class="photo-action-button">이미지 선택</label>
            <button type="button" id="remove-photo-btn" class="photo-action-button">이미지 삭제</button>
            </div>
            <span id="photo-file-name" class="file-name">선택된 파일 없음</span>

            <label for="input-nick">닉네임<span class="input-guide">최대 20자</span></label>
            <input type="text" id="input-nick" maxlength="20">
            <label for="input-id">아이디<span class="input-guide">최대 20자</span></label>
            <input type="text" id="input-id" placeholder="@ 제외 입력" maxlength="20">
            <label for="input-gender">성별</label>
              <select id="input-gender">
                 <option value="미응답">미응답</option>
                 <option value="남성">남성</option>
                 <option value="여성">여성</option>
                 <option value="그 외">그 외</option>
             </select>
            <label for="input-age">나이</label>
                <select id="input-age">
                 <option value="미응답">미응답</option>
                 <option value="미성년">미성년</option>
                 <option value="성년">성년</option>
               </select>
            <label for="input-likecha">좋아하는 차<span class="input-guide">최대 5개</span></label>
            <textarea id="input-likecha" rows="2" placeholder="엔터로 단어 구분이 가능합니다."></textarea>
            <span class="item-count" id="count-likecha">0 / 5개</span>
            <label for="input-likedogu">좋아하는 다구<span class="input-guide">최대 5개</span></label>
            <textarea id="input-likedogu" rows="2" placeholder="엔터로 단어 구분이 가능합니다."></textarea>
            <span class="item-count" id="count-likedogu">0 / 5개</span>
            <label for="input-likewith">같이 좋아하고 있는 것<span class="input-guide">최대 5개</span></label>
            <textarea id="input-likewith" rows="2" placeholder="엔터로 단어 구분이 가능합니다."></textarea>
            <span class="item-count" id="count-likewith">0 / 5개</span>
            <label for="input-hate">보지 못하는 것<span class="input-guide">최대 5개</span></label>
            <textarea id="input-hate" rows="2" placeholder="엔터로 단어 구분이 가능합니다."></textarea>
            <span class="item-count" id="count-hate">0 / 5개</span>
            <label for="input-other">기타사항</label>
            <textarea id="input-other" rows="5" placeholder="엔터로 문장 구분이 가능합니다."></textarea>
            </div>
        <div class="form-actions">  
        <button id="apply-btn" type="button">카드에 반영하기</button>
        <button id="download-btn" type="button">이미지로 저장하기</button>
        </div>  
        </div>
        <div class="card-scale-wrapper">
        <div class="right profile-card" id="profile-card">
            <div class="owner">
                 <div class="photo-box">
                 <span id="photo-placeholder">프로필 이미지 (1:1)</span>
                 <img id="output-photo" src="" alt="프로필 이미지" style="display: none;">
                 </div>
                 <div class="nickname" id="output-nick">닉네임</div>
                 <div class="row"><span class="value">@<sapn class="twitterid" id="output-id">아이디</span></span></div>
                 <hr>
            <div class="sunteck" id="sunteck-gender">
            <div class="dolgle">미응답</div><div class="dolgle">남성</div><div class="dolgle">여성</div><div class="dolgle">그 외</div>
            </div>
            <div class="sunteck" id="sunteck-age">
            <div class="dolgle">미응답</div><div class="dolgle">미성년</div><div class="dolgle">성년</div>
            </div>
            
            <div class="owner-footer">
            <p class="footer-text">Made by. Mohae</p>
            </div>
            
            </div>

            <!--옆라인-->

           <div class="gita">
        <div class="gita-item">
            <p class="gita-label">• 좋아하는 차</p>
            <ul class="character-list" id="output-likecha"></ul>
        </div>

        <div class="gita-item">
            <p class="gita-label">• 좋아하는 다구</p>
            <ul class="character-list" id="output-likedogu"></ul>
        </div>

        <div class="gita-item">
            <p class="gita-label">• 같이 좋아하고 있는 것</p>
            <ul class="character-list" id="output-likewith"></ul>
        </div>

        <div class="gita-item warning">
            <p class="gita-label">• 보지 못하는 것</p>
            <ul class="character-list" id="output-hate"></ul>
        </div>

        <div class="gita-note">
            <p class="gita-label">메모</p>
            <p class="value" id="output-other"></p>
        </div>
        </div>
        
    </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
