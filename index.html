<head>
  <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-layout">
        <div class="left">
            <h2>정보 입력</h2>
            <label>프로필 이미지</label>
            <input type="file" id="input-photo" accept="image/*">
            <label>닉네임</label>
            <input type="text" id="input-nick">
            <label>아이디</label>
            <input type="text" id="input-id" placeholder="@ 제외 입력">
            <label>성별</label>
              <select id="input-gender">
                 <option value="미응답">미응답</option>
                 <option value="남성">남성</option>
                 <option value="여성">여성</option>
                 <option value="그 외">그 외</option>
             </select>
            <label>나이</label>
                <select id="input-age">
                 <option value="미응답">미응답</option>
                 <option value="미성년">미성년</option>
                 <option value="성년">성년</option>
               </select>
            <label>좋아하는 차</label>
            <textarea id="input-likecha" rows="2" placeholder="엔터로 문장 구분이 가능합니다."></textarea>
            <label>좋아하는 다구</label>
            <textarea id="input-likedogu" rows="2" placeholder="엔터로 문장 구분이 가능합니다."></textarea>
            <label>같이 좋아하고 있는 것</label>
            <textarea id="input-likewith" rows="2" placeholder="엔터로 문장 구분이 가능합니다."></textarea>
            <label>보지 못하는 것</label>
            <textarea id="input-hate" rows="2" placeholder="엔터로 문장 구분이 가능합니다."></textarea>
            <label>기타사항</label>
            <textarea id="input-other" rows="5" placeholder="엔터로 문장 구분이 가능합니다."></textarea>
            <br>
            <br>
        <button id="apply-btn">카드에 반영하기</button>
        <br>
        <button id="download-btn">이미지로 저장하기</button>
        </div>
        <div class="card-scale-wrapper">
        <div class="right profile-card" id="profile-card">
            <div class="owner">
                 <div class="photo-box">
                 <span id="photo-placeholder">프로필 이미지 (1:1)</span>
                 <img id="output-photo" src="" alt="프로필 이미지" style="display: none;">
                 </div>
                 <div class="nickname" id="output-nick">닉네임</div>
                 <div class="row"><span class="value">@<div class="twitterid" id="output-id">아이디</div></span></div>
                 <hr>
            <div class="sunteck" id="sunteck-gender">
            <div class="dolgle">미응답</div><div class="dolgle">남성</div><div class="dolgle">여성</div><div class="dolgle">그 외</div>
            </div>
            <div class="sunteck" id="sunteck-age">
            <div class="dolgle">미응답</div><div class="dolgle">미성년</div><div class="dolgle">성년</div>
            </div>
            
            <div class="owner-footer">
            <p class="footer-text">Made by. Mohae</p>
            </div>
            
            </div>

            <!--옆라인-->

           <div class="gita">
        <div class="gita-item">
            <p class="gita-label">• 좋아하는 차</p>
            <ul class="character-list" id="output-likecha"></ul>
        </div>

        <div class="gita-item">
            <p class="gita-label">• 좋아하는 다구</p>
            <ul class="character-list" id="output-likedogu"></ul>
        </div>

        <div class="gita-item">
            <p class="gita-label">• 같이 좋아하고 있는 것</p>
            <ul class="character-list" id="output-likewith"></ul>
        </div>

        <div class="gita-item warning">
            <p class="gita-label">• 보지 못하는 것</p>
            <ul class="character-list" id="output-hate"></ul>
        </div>

        <div class="gita-note">
            <p class="gita-label">메모</p>
            <p class="value" id="output-other"></p>
        </div>
        </div>
        
    </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
